<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЭлектроГараж — прототип 0.2</title>
<style>
:root{--bg:#0d1117;--panel:#161d27;--panel2:#202b38;--text:#edf3fa;--muted:#9aabba;--accent:#ffb84d;--green:#61d095;--line:#2b3948}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px 18px 16px;background:linear-gradient(135deg,#172434,#111820);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,.tab{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer;font:inherit}
button:hover,.tab:hover{border-color:var(--accent)}.active{background:#3a2c1c;border-color:var(--accent);color:#ffe0ad}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.muted{color:var(--muted)}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#243447;color:#b9d7f5;font-size:13px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f151d;color:var(--text);font:inherit;margin:8px 0}
h2{margin:8px 0 14px}h3{margin:5px 0 8px}li{margin:6px 0}.choice{display:block;text-align:left;width:100%;margin:7px 0}.back{margin-top:8px}.diagram{font-family:monospace;white-space:pre-wrap;background:#0b1219;padding:14px;border-radius:12px;border:1px solid var(--line);overflow:auto}
.progress{height:8px;background:#273443;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--green)}
footer{padding:22px;color:var(--muted);text-align:center;font-size:13px}
</style>
</head>
<body>
<header><h1>⚡ ЭлектроГараж</h1><p>Учись диагностировать — проверяй последовательно, не меняй детали наугад.</p></header>
<main>
<nav>
<button class="tab active" data-page="home">Главная</button>
<button class="tab" data-page="lessons">Уроки</button>
<button class="tab" data-page="diagnosis">Диагностика</button>
</nav>
<section id="app"></section>
</main>
<footer>Прототип 0.2 · Учебные рекомендации. Сверяйся со схемой и руководством конкретного автомобиля.</footer>
<script>
const lessons=[
{n:1,t:"Основы электричества",d:"Напряжение, ток и сопротивление",body:"Напряжение — разность электрических потенциалов. Ток — движение заряда. Сопротивление ограничивает ток. Для автоэлектрики важно понимать, что наличие напряжения без нагрузки ещё не гарантирует, что цепь способна провести нужный ток."},
{n:2,t:"Мультиметр",d:"Основные режимы и безопасные измерения",body:"Измеряй напряжение параллельно цепи. Сопротивление и прозвонку выполняй только на обесточенной цепи. Перед измерением тока проверь гнездо щупа и предел прибора; не подключай мультиметр в режиме амперметра поперёк аккумулятора."},
{n:3,t:"Предохранители",d:"Как проверить защиту цепи",body:"Сначала найди предохранитель по схеме. Проверяй контрольные площадки или извлечённый предохранитель прозвонкой на обесточенной цепи. Замена — только на тот же номинал. Если новый снова перегорает, ищи перегрузку или короткое замыкание."},
{n:4,t:"Плохая масса",d:"Проверка падения напряжения",body:"Плохая масса вызывает тусклый свет, медленную прокрутку стартера и нестабильную работу устройств. Проверяй падение напряжения под нагрузкой: красный щуп на корпус проверяемого узла, чёрный — на минус аккумулятора. Нормы зависят от цепи и автомобиля."},
{n:5,t:"Обрыв проводки",d:"Поиск неисправности по участкам",body:"Если питания нет на потребителе, проверяй цепь по точкам от источника. Прозвонку выполняй на отключённой цепи, изолировав провод с обоих концов от электроники. OL/обрыв указывает на отсутствие непрерывности."},
{n:6,t:"Автомобильное реле",d:"Катушка и силовые контакты",body:"В распространённом реле контакты 85 и 86 — катушка, 30 — силовой вход, 87 — выход при срабатывании; у переключающего реле может быть 87a. Проверяй маркировку на корпусе. Щелчок не гарантирует исправность контактов под нагрузкой."},
{n:7,t:"Падение напряжения",d:"Находим слабый контакт под нагрузкой",body:"Измеряй напряжение непосредственно между концами проверяемого участка во время его работы. Большое падение указывает на сопротивление в соединении, кабеле или контакте. Допустимые пределы уточняй по документации автомобиля."},
{n:8,t:"Как читать электрические схемы",d:"Питание, масса, предохранитель и потребитель",body:"Начинай читать схему от источника питания к потребителю и затем к массе. Условные обозначения могут различаться у производителей — всегда сверяй легенду схемы.\n\n1. Найди источник питания: аккумулятор или цепь после замка.\n2. Найди предохранитель и его номинал.\n3. Проследи провод до разъёма или потребителя.\n4. Найди обратный путь — массу или управляющую цепь.\n5. Обрати внимание на точки соединения, разъёмы, номера контактов и обозначения проводов.\n6. Сопоставь схему с реальной проводкой, не прокалывай изоляцию без необходимости."}
];
let page="home",selectedLesson=null,diagStep=0,diagAnswers=[];
const diagnosis=[
{q:"Что именно не работает?",opts:["Одна фара","Обе фары","Фары работают нестабильно"],next:[1,2,3]},
{q:"Одна фара не горит. Начинаем с простого.",opts:["Лампа исправна?","Лампа перегорела","Не уверен"],next:[4,5,6]},
{q:"Обе фары не горят.",opts:["Проверить общий предохранитель / питание по схеме","Лампы обе перегорели","Не уверен"],next:[7,8,9]},
{q:"Свет мерцает или меняется яркость.",opts:["Проверить клеммы и массу под нагрузкой","Проверить лампу/разъём","Перейти к проверке падения напряжения"],next:[10,11,12]},
{result:"Если лампа исправна, переходи к проверке питания на разъёме и массы. Используй схему именно своего автомобиля."},
{result:"Замени лампу на подходящую по типу и мощности. Если новая не работает, продолжай проверку питания и массы."},
{result:"Не угадывай: проверь лампу, разъём, питание и массу последовательно."},
{result:"Проверь предохранитель по схеме, питание до и после него, а также реле/управление, если предусмотрено. Не ставь предохранитель большего номинала."},
{result:"Даже если обе лампы одновременно отказали, проверь питание, предохранитель и общие соединения — не меняй обе лампы без проверки."},
{result:"Сначала проверяй предохранитель и питание общей цепи, затем управляющий сигнал и массу."},
{result:"Осмотри клеммы аккумулятора, точки массы и разъёмы на коррозию/ослабление. Затем измерь падение напряжения под нагрузкой."},
{result:"Проверь разъём и лампу: следы нагрева, окисление, плохую посадку контактов. Не трогай горячие элементы."},
{result:"Измерь падение напряжения на плюсовом и массовом участках при включённых фарах. Сравни с нормативом производителя."}
];
function render(){
const app=document.getElementById("app");
document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
if(page==="home"){app.innerHTML=`<div class="card"><span class="tag">Версия 0.2</span><h2>Добро пожаловать в гараж</h2><p>8 базовых уроков и первый пошаговый сценарий диагностики.</p><div class="grid"><button onclick="go('lessons')">📚 Открыть уроки</button><button onclick="restartDiag()">🔎 Начать диагностику</button></div></div><div class="card"><h3>План ближайшего развития</h3><ul><li>Добавить иллюстрации и схемы с русскими подписями.</li><li>Расширить дерево диагностики по симптомам.</li><li>Сохранение избранного и прогресса.</li><li>Подготовить к веб-публикации и мобильным платформам.</li></ul></div>`}
if(page==="lessons"){app.innerHTML=`<h2>Учебные уроки</h2><input id="search" placeholder="Поиск по урокам…" oninput="filterLessons(this.value)"><div id="lessonList" class="grid">${lessonCards(lessons)}</div>`}
if(page==="lesson"){let l=lessons.find(x=>x.n===selectedLesson);app.innerHTML=`<button onclick="go('lessons')">← Назад к урокам</button><div class="card"><span class="tag">Урок №${l.n}</span><h2>${l.t}</h2><p class="muted">${l.d}</p><p>${l.body.replaceAll("\n","<br>")}</p>${l.n===8?`<div class="diagram">АККУМУЛЯТОР (+)\n   │\n   ▼\n[ПРЕДОХРАНИТЕЛЬ]\n   │\n   ▼\n[ПОТРЕБИТЕЛЬ: ЛАМПА]\n   │\n   ▼\nМАССА / АККУМУЛЯТОР (−)\n\nПуть тока — проверяем последовательно.</div>`:""}<button onclick="go('lessons')">К списку уроков</button></div>`}
if(page==="diagnosis"){diagRender()}
}
function lessonCards(arr){return arr.map(l=>`<button class="choice" onclick="openLesson(${l.n})"><span class="tag">Урок ${l.n}</span><h3>${l.t}</h3><small class="muted">${l.d}</small></button>`).join("")}
function filterLessons(v){document.getElementById("lessonList").innerHTML=lessonCards(lessons.filter(l=>(l.t+" "+l.d+" "+l.body).toLowerCase().includes(v.toLowerCase())))}
function go(p){page=p;render()}function openLesson(n){selectedLesson=n;page="lesson";render()}
function restartDiag(){page="diagnosis";diagStep=0;diagAnswers=[];render()}
function diagRender(){let s=diagnosis[diagStep];if(s.result){document.getElementById("app").innerHTML=`<div class="card"><span class="tag">Результат диагностики</span><h2>Следующий шаг</h2><p>${s.result}</p><p class="muted">Если проверка требует доступа к опасным или высокотоковым цепям, лучше обратиться к специалисту.</p><button onclick="restartDiag()">Начать сначала</button><button onclick="go('lessons')">Открыть уроки</button></div>`;return}
document.getElementById("app").innerHTML=`<div class="card"><span class="tag">Диагностика · шаг ${diagStep+1}</span><div class="progress"><span style="width:${Math.round((diagStep+1)/4*100)}%"></span></div><h2>${s.q}</h2>${s.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})">${o}</button>`).join("")}<button class="back" onclick="diagBack()" ${diagStep===0?"disabled":""}>← Назад</button><button class="back" onclick="restartDiag()">Сбросить</button></div>`}
function choose(i){diagAnswers.push(i);diagStep=diagnosis[diagStep].next[i];diagRender()}function diagBack(){if(diagAnswers.length){diagAnswers.pop();diagStep=0;diagAnswers.forEach(a=>diagStep=diagnosis[diagStep].next[a]);diagRender()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script>
</body></html>
